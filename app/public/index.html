<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Devi Hub</title>
    <!--
      Installable website (25 Nov 2026): the app description and icons, so
      browsers offer "Install" and iPhones "Add to Home Screen" with the Hub's
      icon. The offline copy itself is public/sw.js, started by src/web/pwa.js.
    -->
    <link rel="manifest" href="/devikins-legacy-hub/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/devikins-legacy-hub/apple-touch-icon.png" />
    <meta name="theme-color" content="#121214" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Devi Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
