# Builds the Hub website and publishes it on GitHub Pages
# (https://raphaelrohner.github.io/devikins-legacy-hub/).
#
# Runs by itself on every push to `main`, and can also be started by hand
# from the repo's "Actions" tab ("Run workflow").
#
# What it does, in plain words:
#   1. test:    four machines at the same time each take a fresh copy of the
#               code, install the exact packages from app/package-lock.json,
#               build the web version (`npx expo export -p web`) and run a
#               quarter of the automatic website tests (app/tests/web, see
#               app/TESTING.md); one of them also runs the chat core's tests
#               (23 Oct 2026, Raphael: the tests had grown to ~12 minutes in
#               a row);
#   2. publish: only when all four are green, the build goes to GitHub
#               Pages. If a test fails, the live website simply stays as it
#               was, and the failed run shows up red in the Actions tab with
#               a test report (screenshots of what went wrong) to download.

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # Fixed to Ubuntu 24.04: GitHub moves "ubuntu-latest" to Ubuntu 26 from
    # October 2026, and Playwright cannot install its browser helpers there yet.
    runs-on: ubuntu-24.04
    # Inside Playwright's own ready-made machine image: Chrome and everything
    # it needs are already installed. Installing them each time (from
    # Ubuntu's servers) sometimes hung for many minutes on 23 Oct 2026.
    # The version must match @playwright/test in app/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    strategy:
      # All four always finish, so a red run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The chat core's own tests (plain JavaScript, no browser needed) - on
      # one machine only.
      - if: matrix.shard == 4
        run: npm run test:chat
      # Each machine builds the website itself (same code, same result) -
      # quicker than waiting for one build to be handed around.
      - run: npx expo export -p web
      # (Already in the image - this only downloads Chrome if the Playwright
      # version was updated and the image above wasn't yet: no system packages.)
      - run: npx playwright install chromium
      # The automatic website tests on that build - this machine runs its
      # quarter. They use pretend servers only, so they never contact
      # Klever or Moonlabs.
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.shard }}
          path: |
            app/test-report
            app/test-results
          retention-days: 14
      # The finished website, for publishing (from one machine).
      - if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: app/dist
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      # GitHub Pages shows 404.html for any address it doesn't know; a copy
      # of the app's page means reloading or sharing a deeper link still
      # opens the Hub instead of an error page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: publish
    # Fixed to Ubuntu 24.04 (see above).
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
